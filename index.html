<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        input, button {
            width: 90%;
            padding: 10px;
            margin: 7px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>[ MODIFIED ] Tech Fest 2026</h1>

    <p>Student technical event registration.</p>

    <form>
        <input type="text" placeholder="Student Name" required>
        <input type="text" placeholder="Register Number" required>
        <input type="text" placeholder="Department" required>
        <input type="email" placeholder="Email" required>

        <p>Event Date:</p>
        <input type="date" required>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>

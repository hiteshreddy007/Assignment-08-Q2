apiVersion: apps/v1
kind: Deployment

metadata:
  name: event-registration

spec:
  replicas: 3

  selector:
    matchLabels:
      app: event-registration

  template:
    metadata:
      labels:
        app: event-registration

    spec:
      containers:
        - name: event-registration
          image: hiteshreddy007/event-registration:v1

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: event-registration-service

spec:
  type: NodePort

  selector:
    app: event-registration

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30011
